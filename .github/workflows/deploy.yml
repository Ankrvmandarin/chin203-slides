name: Deploy slides to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm build

      # 學生網站上隱藏「Themes」與「Draft」兩列側邊欄項目。
      # 只作用於發佈版；本機 pnpm dev 完全不受影響。
      - name: Hide Themes and Draft in the published sidebar
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('dist/index.html')
          html = p.read_text(encoding='utf-8')
          labels = ['Themes', 'テーマ', '主题', '主題',
                    'Draft', '下書き', '草稿']
          sels = ', '.join(f'div:has(> button[aria-label="{l}"])' for l in labels)
          css = f'<style>{sels}{{display:none !important}}</style>'
          if css not in html:
              html = html.replace('</head>', css + '</head>')
              p.write_text(html, encoding='utf-8')
              print('injected:', sels)
          PY

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
